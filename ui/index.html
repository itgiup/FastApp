<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/logox48.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App</title>
</head>

<body style="background-color: rgb(20 20 20);">
  <div id="root">

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans',
          'Helvetica Neue', sans-serif;
      }

      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: white;
      }

      .loading img {
        width: 48px;
        height: 48px;
        animation: spin 1.2s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      .loading p {
        margin-top: 10px;
        font-size: 1.2em;
        animation: fadeIn 1.5s ease-in-out infinite alternate;
      }

      @keyframes fadeIn {
        from {
          opacity: 0.5;
        }

        to {
          opacity: 1;
        }
      }
    </style>

    <div class="loading">
      <img src="/images/logox48.png" alt="Loading..." />
      <p>>>Loading..</p>
    </div>
    <noscript>
      <strong>We're sorry but the app doesn't work properly without JavaScript enabled. Please enable it to
        continue.</strong>
    </noscript>
  </div>
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
